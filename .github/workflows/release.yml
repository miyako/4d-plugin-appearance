# Builds the macOS universal plugin, preserving committed Windows siblings,
# resources and dependencies. There is intentionally no Windows build job.
# Dispatch on an immutable source commit with zero inputs; publication is create-only.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: Appearance
  XCODE_PROJECT: Appearance.xcodeproj
  VCX_SOLUTION: Appearance.sln
  MACOS_DEPLOYMENT_TARGET: '11.0'
  # --------------------------------------------------------------

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: validate source and publication availability
        id: set
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$SELECTED_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PLUGINS_DIR="test/Plugins"
          BUNDLE_PATH="$PLUGINS_DIR/${{ env.PRODUCT_NAME }}.bundle"
          # Invalidate only generated files; Default and resource siblings are not ours.
          rm -f "${BUNDLE_PATH:?}/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          rm -f "${BUNDLE_PATH:?}/Contents/Info.plist"
          rm -f "${BUNDLE_PATH:?}/Contents/Resources/English.lproj/InfoPlist.strings"
          rm -rf "${BUNDLE_PATH:?}/Contents/_CodeSignature"
          # Equivalent to the original CONFIGURATION_BUILD_DIR=$(BUILD_DIR),
          # with SYMROOT=$(SRCROOT)/test/Plugins; make the packaging path explicit.
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          if [ ! -s "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN"
            exit 1
          fi
          ARCH_INFO=$(lipo -info "$BIN")
          echo "$ARCH_INFO"
          grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)' <<< "$ARCH_INFO"
          grep -Eq '(^|[[:space:]])x86_64([[:space:]]|$)' <<< "$ARCH_INFO"
          python3 .github/scripts/source_version.py verify-bundle "$BUNDLE_PATH"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          # A zero exit status alone does not mean Apple accepted the submission.
          notarize() {
            local OUT STATUS
            OUT=$(xcrun notarytool submit "$1" --keychain-profile "notarytool-profile" \
              --keychain "$KEYCHAIN_PATH" --wait --output-format json) || return 1
            echo "$OUT"
            STATUS=$(printf '%s' "$OUT" | python3 -c 'import json,sys; print("Accepted" if json.load(sys.stdin)["status"] == "Accepted" else "Rejected")') || return 1
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization of $1 returned '$STATUS'"
              return 1
            fi
          }
          notarize "$ZIP_PATH"
          notarize "$DMG_PATH"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: final availability check and create-only publication
        env:
          SELECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check --sha "$SELECTED_SHA"
          python3 .github/scripts/release.py publish --sha "$SELECTED_SHA" "$ZIP_PATH" "$DMG_PATH"
