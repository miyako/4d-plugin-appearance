# Coordinated source metadata only; Build is a separate manual operation.
name: Bump

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-version-bump
  cancel-in-progress: false

env:
  # With zero dispatch inputs, the selected branch's workflow chooses the part.
  BUMP_PART: patch # patch, minor or major

jobs:
  bump:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump and push source metadata only
        env:
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/source_version.py bump --part "$BUMP_PART" --expected-sha "$SELECTED_SHA" --branch "$SELECTED_BRANCH"

      - name: summary
        run: echo "### Source version committed. No tag or Build was triggered; run Build manually on the selected branch." >> "$GITHUB_STEP_SUMMARY"
